[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planetix"
version = "0.1.0"
description = "Reproducible analysis of extreme trans-Neptunian object orbits and the Planet Nine hypothesis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
nbody = ["rebound>=4.0", "reboundx>=4.0"]
inference = ["dynesty>=2.1"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planetix = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
